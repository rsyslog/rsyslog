stages:
  - "build/fuzz"
  - "CASR triage"

variables:
  FUZZ_IMAGE: "alpine:3.23"
  CASR_VERSION: "2.13.0"
  FUZZ_TARGET_NAME: "rsyslog_parsers"
  FUZZ_MAX_TOTAL_TIME_SECONDS: "60"
  FUZZ_NO_NEW_PATH_SECONDS: "60"
  FUZZ_TIMEOUT_MS: "1000+"
  FUZZ_SMOKE_TIMEOUT: "15"
  CASR_TIMEOUT: "10"

default:
  image: "$FUZZ_IMAGE"
  before_script:
    - >-
      apk add --no-cache
      afl++ autoconf autoconf-archive automake bash bison build-base
      ca-certificates cargo clang compiler-rt coreutils curl file findutils
      flex gdb git libestr-dev libfastjson-dev libtool linux-headers make
      openssl-dev patch perl pkgconf python3 rust tar util-linux-dev xz zlib-dev
    - update-ca-certificates
    - cargo install --locked --root /usr/local --version "$CASR_VERSION" casr
    - command -v afl-clang-fast
    - command -v afl-fuzz
    - command -v casr-afl

build_and_fuzz:
  stage: "build/fuzz"
  timeout: 30m
  script:
    - /bin/sh fuzz/ci_build_and_fuzz.sh
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - artifacts/out/
      - artifacts/evidence/
      - artifacts/metadata/
      - fuzz/fuzz_rsyslog_parsers
      - runtime/.libs/
      - grammar/.libs/
      - compat/.libs/

casr_triage:
  stage: "CASR triage"
  timeout: 15m
  needs:
    - job: build_and_fuzz
      artifacts: true
  script:
    - /bin/sh fuzz/ci_casr_triage.sh
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - artifacts/casr/
