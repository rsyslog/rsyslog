# Seed map for AI agents; keep minimal and truthful. Extend over time.
# Per-module metadata (support status, maturity, contacts) lives in each module
# directory as `MODULE_METADATA.yaml`; update both the metadata file and this map
# when concurrency guidance changes.
runtime_queue:
  operator_docs:
    - "doc/source/concepts/queues.rst#local-queue-operation"
    - "doc/source/rainerscript/queue_parameters.rst#queue-scope-local"
  paths:
    - "runtime/queue.c"
    - "runtime/queue.h"
    - "runtime/queue_local.c"
    - "runtime/queue_local.h"
    - "runtime/queue_local_stats.c"
    - "runtime/queue_local_stats.h"
    - "runtime/queue_spsc.c"
    - "runtime/queue_spsc.h"
    - "runtime/queue_lease.h"
    - "runtime/queue_da.c"
    - "runtime/queue_da.h"
    - "runtime/wti.c"
    - "runtime/wti.h"
    - "runtime/segdisk_store.c"
    - "runtime/segdisk_store.h"
  requires_serialization: true
  notes:
    - >-
      Worker batches carry physical-source and logical-owner attribution.
      Ordinary acquisition and completion require the source to match the
      worker pool user and held mutex; a DA child keeps its parent as logical
      owner. Local FE helpers use separate, explicitly validated memory-BE
      borrowing/completion APIs. Their home pool and module worker state never
      change. Returned store-completion failure retains the source lease and
      opaque context; inherited terminal disk cleanup is not repaired here.
    - >-
      Experimental local scope uses bounded producer-owned SPSC front ends
      and an existing FixedArray or LinkedList backend. Each front end has its own worker pool,
      source identity and module worker state. An eligible worker checks its
      FE first and otherwise borrows one bounded available BE batch, with
      completion attributed to BE and a fresh FE check before further borrowing.
      Helpers never publish retries into their SPSC ring. Idle registration and
      notification use BE-before-FE locking; ordinary successful FE publication
      does not take the BE mutex. This implementation remains subject to the
      staged local-queue qualification gates.
    - >-
      Local sampling and severity discard are logical preadmission policies.
      Enabled policies serialize sequence selection and sample aggregate FE/BE memory
      pressure under the BE mutex; default FE routing does not acquire that mutex.
      Surviving messages retain one whole-batch routing decision. Transfers and
      source retries bypass sampling, including DA handoff. Policy drops are
      separate from preadmission errors and accepted-message terminal discard.
      LinkedList retry insertion failure must have an explicit ownership outcome.
    - >-
      Local queue.size and full/light delay marks remain BE-specific. Resource
      reservation is B+N*(F+D), with D=min(dequeueBatchSize,F) and a lifetime FE
      registration cap N. It bounds memory delivery obligations, not RSS or disk
      backlog. Resource gauges and allocation estimates are reported separately.
      FE minimum-batch waiting clamps to D; helper acquisition never waits for a
      minimum. FE execution also honors dequeue time windows and slowdown.
    - >-
      Local queue graphs register actual FE, BE and disk recovery execution workers as
      downstream producers, including workers at global memory boundaries.
      Static ruleset calls and module retry destinations contribute queue edges;
      cycles and dynamic call targets are rejected before activation. Shutdown
      joins upstream workers before closing downstream admission, retains all
      queue objects until graph termination, and shares absolute graceful/action
      deadlines across nodes. Full downstream enqueue waits respect that budget.
      Asynchronous action copying still follows action.copyMsg; synchronous calls
      retain the caller's worker state. Graph activation releases recovery only after
      all destinations are initialized. Callback pools stop in topological order
      before a second pass consolidates remaining FE obligations and invokes the
      existing DA save/checkpoint machinery. The existing persistence phase may
      extend beyond shared callback deadlines; it has no new bounded-save promise.
    - >-
      omfwd connection eligibility and transaction suspension use worker-local
      active-target counts; shared target counts are telemetry only. Local omfwd
      excludes networkNamespace because its saved namespace descriptor is shared.
      omelasticsearch exposes its retry ruleset as an explicit graph edge;
      retries to the same execution queue are rejected as cycles.
    - >-
      Local routing quiescence and source-specific immediate flags let frontend
      workers stop and join before maintenance transfers their retained references
      to the still-running backend. Shutdown phases share monotonic deadlines;
      expiry never authorizes freeing live callback state. Snapshot objects are
      unlinked before worker pools and fixed frontend descriptors are freed.
    - >-
      Local DA reuses both classic and segmented disk assistance, engine selection,
      spool identity and recovery formats. FE helpers borrow memory only when
      existing DA arbitration permits it. An activated graph DA transfer worker
      parks at low water and is awakened by existing high-water advice, retaining
      one idle transfer thread instead of entering an unnotified exit/refill
      window. Shutdown/save bypass parking. BE-to-disk transfer is not action
      completion. Local outcome counters distinguish executed, persisted and
      discarded obligations; segmented restored counts grow as lazy recovery
      discovers actual records, excluding its scheduling sentinel. Unscanned
      durable records remain in the existing recovery store and are not invented
      as a one-record logical obligation. Detached emergency disk children remain
      lifetime-owned for graph joining without changing the existing fallback.
    - Disk-assisted mode is an in-memory parent plus a first-class disk child; disk queue semantics apply to the child.
    - The queue mutex is shared by a disk-assisted parent and child; segmented store operations and idle dematerialization callbacks run under that lock.
    - >-
      Segmented integer statistics mirrors publish via PREFER_STORE_INT to match
      statsobj's atomic readers. Writer-side queue locking alone does not
      synchronize with the independent impstats reader. Local disk snapshots load
      pqDA once with acquire semantics; a detached child remains lifetime-owned
      until statistics unlink and graph teardown.
    - >-
      Targeted worker wakeups in wtpAdviseMaxWorkers track registered waiters
      with bWaitingForWork and bWakeupReserved under each pool's pmutUsr (the
      queue mutex paired with pcondBusy); producers reserve a waiter before
      signaling, and normal or cancellation wait cleanup clears the
      reservation under that mutex. Both wtpAdviseMaxWorkers and
      wtpWakeupAllWrkr require callers to hold pmutUsr.
    - Completed message references move to a bounded worker buffer after store completion and are destroyed outside the queue mutex, before callbacks or waits; cancellation is disabled during this transfer and disposal.
    - RAM retirement releases completed counts independently of batch order; segmentedDisk retains its ordered persistent frontier.
    - queue_da resolves the durable disk-child engine at startup and atomically publishes its marker before first persistent data; engines never switch while a process is running.
    - The segmented store is lazy only for a disk-assisted child, and dematerialization requires an empty store with no recovery, batch, retry, or completion work pending.

runtime_ratelimit:
  paths: ["runtime/ratelimit.c", "runtime/ratelimit.h"]
  requires_serialization: true
  locks:
    - type: rwlock
      field: ratelimit_cfg_bucket_t.lock
    - type: mutex
      field: ratelimit_shared_t.mut
    - type: mutex
      field: ratelimit_shared_t.per_source_policy_mut
    - type: mutex
      field: ratelimit_shared_t.per_source_key_policy_mut
    - type: mutex
      field: ratelimit_ps_bucket_t.mut
    - type: mutex
      field: ratelimit_t.mut
  notes:
    - Named ratelimit configs are stored in sharded hashtables; lookup and insertion lock only the shard selected by the config name.
    - Input per-source ratelimit state is stored in shard-local hashtables with embedded override data; message-time accounting locks only the source-key shard.
    - Per-source key policy uses a versioned atomic snapshot of the template pointer and packed mode flags; readers retry across updates, and the key-policy mutex is only the no-atomics fallback.
    - perSourceMaxStates is enforced approximately through shard-local caps; values below the shard count keep one active state per shard, and per_source_evicted reports source-state evictions.
    - HUP snapshots named configs under shard read locks, then reloads policy files without holding registry locks.

runtime_tcpsrv:
  paths:
    - "runtime/tcpsrv.c"
    - "runtime/tcpsrv.h"
    - "runtime/tcps_sess.c"
    - "runtime/tcps_sess.h"
  requires_serialization: false
  notes:
    - imtcp sessions own independent decompressor state.
    - A finite zstd aggregate-window limit uses a listener-local 64-bit atomic reservation counter; only platforms without 64-bit atomics use the helper-mutex fallback.

runtime_msg:
  paths: ["runtime/msg.c", "runtime/msg.h"]
  requires_serialization: true
  notes:
    - MsgGetRcvFromProp returns fromhost, fromhost-ip, or fromhost-port with the stored prop length; it resolves DNS only when NEEDS_DNSRESOL is still set.
    - MsgDup locks the source message while coherently copying JSON state and the lazy turbo snapshot callbacks.
    - Turbo parse snapshots are immutable and may be shared by MsgDup copies through an atomic reference count; each owner must release only through MsgReleaseTurboResult while holding the message lock or exclusive access.

mmnormalize:
  paths: ["plugins/mmnormalize/"]
  requires_serialization: true
  locks:
    - type: rwlock
      field: instanceData.ctxlnLock
    - type: atomic-generation
      field: instanceData.reloadGeneration
    - type: stdio
      field: instanceData.debugFile
  notes:
    - The standard liblognorm context is shared; actions take the read lock and HUP publishes a privately built replacement under the write lock.
    - Turbo contexts are worker-owned and remain lock-free while normalizing; HUP increments a generation and each worker rebuilds and reclaims its own context between messages.
    - When debugFile is configured, liblognorm callbacks share an instance FILE and use flockfile to serialize writes.

netstream_driver_api:
  paths:
    - "runtime/nsd.h"
    - "runtime/netstrm.h"
    - "runtime/netstrm.c"
    - "runtime/nsd_gtls.c"
    - "runtime/nsd_mbedtls.c"
    - "runtime/nsd_ossl.c"
    - "runtime/nsd_ptcp.c"
  requires_serialization: false
  notes:
    - netstrm API v20 delegates SetDrvrTlsCAExtraFiles() to NSD API v21 SetTlsCAExtraFiles().
    - Every NSD driver implementation must provide SetTlsCAExtraFiles(), returning its normal unsupported-setting result when it cannot load additional CA sources.
    - The ossl driver accepts comma-separated file lists or strict pkcs11: URI lists; the other current drivers reject non-null extra CA sources as unsupported.

omfile:
  paths: ["plugins/omfile/"]
  requires_serialization: true
  locks:
    - type: mutex
      field: pData.mutWrite

omfwd:
  paths: ["plugins/omfwd/"]
  requires_serialization: false

omelasticsearch:
  paths: ["plugins/omelasticsearch/"]
  requires_serialization: false

omazureeventhubs:
  paths: ["plugins/omazureeventhubs/"]
  requires_serialization: true
  locks:
    - type: rwlock
      field: pData.pnLock
      writer: rsyslog_worker
      reader: proton_thread

omazuredce:
  paths: ["plugins/omazuredce/"]
  requires_serialization: true
  locks:
    - type: mutex
      field: pWrkrData.batchLock
  notes:
    - Each worker owns its batch buffer and timer thread; access is serialized by batchLock.

omawslogshlc:
  paths: ["plugins/omawslogshlc/"]
  requires_serialization: false
  notes:
    - Each worker owns its CURL handle and HLC batch buffer; action configuration is immutable after startup.

contrib_omhttp:
  paths: ["contrib/omhttp/"]
  requires_serialization: false

contrib_mmkubernetes:
  paths: ["contrib/mmkubernetes/"]
  requires_serialization: false
  notes:
    - WID is per-thread; shared caches in pData must be guarded.

contrib_imkubernetes:
  paths: ["contrib/imkubernetes/"]
  requires_serialization: false
  notes:
    - The single input thread owns file tail state, partial-record buffers, cache entries, and the CURL client.

mmsnareparse:
  paths: ["plugins/mmsnareparse/"]
  requires_serialization: false
  notes:
    - Parsing logic does not maintain shared mutable state.

ommysql:
  paths: ["plugins/ommysql/"]
  requires_serialization: false
  notes:
    - Per-worker MYSQL handle in pWrkrData; no module-level RW lock required after refactor.

mmjsontransform:
  paths: ["plugins/mmjsontransform/"]
  requires_serialization: false
  notes:
    - Rewrites JSON trees per message without shared mutable state.

mmjsonrewrite:
  paths: ["plugins/mmjsonrewrite/"]
  requires_serialization: false
  notes:
    - Expands dotted JSON property names into nested containers per message.

pmnormalize:
  paths: ["plugins/pmnormalize/"]
  requires_serialization: true
  locks:
    - type: stdio
      field: instanceConf.debugFile
  notes:
    - When debugFile is configured, liblognorm callbacks share a parser-instance FILE and use flockfile to serialize writes.

mmexternal:
  paths: ["plugins/mmexternal/"]
  requires_serialization: true
  locks:
    - type: mutex
      field: pData.mut
  notes:
    - Default mode keeps one child process context per worker.
    - forceSingleInstance shares one child context in pData and serializes helper access with pData.mut.

omotel:
  paths: ["plugins/omotel/"]
  requires_serialization: false
  notes:
    - Transport resources are not yet active; introduce pData locking once they appear.

imbeats:
  paths: ["plugins/imbeats/"]
  requires_serialization: true
  locks:
    - type: mutex
      field: instanceConf.mutSessions
  notes:
    - Listener threads own readiness notification and worker threads process native Lumberjack session state.
    - Use Elastic Agent or Filebeat output.logstash to send Lumberjack v2 traffic to imbeats.
    - Concurrent Beats sessions are bounded per listener with maxSessions and processed through the listener worker/multiplexing path.
    - Use starvationProtection.maxReads to keep one busy sender from monopolizing imbeats worker time.
    - maxInFlightBytes accounts incomplete receive buffers, inflate scratch space, event copies, and lazy window descriptors exactly across each input instance.
    - maxCompressionRatio and maxDecompressedSize jointly bound compressed-frame expansion.
    - idleTimeout closes sessions with no byte progress; frameTimeout bounds one frame and windowTimeout bounds one advertised window with absolute deadlines that trickle traffic cannot extend. These network deadlines pause while a complete batch is submitted and resume for its ACK. A value of 0 disables the corresponding timeout.
    - JSON event payloads must be exactly one object, apart from surrounding whitespace. Malformed, non-object, trailing-content, resource-limited, or timed-out traffic is not acknowledged.
    - Valid Lumberjack v2 W, J, and C flows retain cumulative A acknowledgement behavior.
    - TLS deployments require an installed rsyslog TLS stream-driver package or module, such as rsyslog-gnutls or rsyslog-openssl.
    - The common Elastic Agent TLS setup validates the rsyslog server certificate but does not present a client certificate; use streamDriver.authMode=anon for that pattern and stricter auth modes only with sender client certificates.
    - Compressed Lumberjack v2 frames are supported and should be tested with Beats compression enabled.
    - A concrete sample container definition lives under packaging/docker/rsyslog/imbeats but is not wired into published container builds yet.

imfifo:
  paths: ["plugins/imfifo/"]
  requires_serialization: true
  notes:
    - Reads log messages line-by-line from local POSIX named pipes (FIFOs).
    - Utilizes non-blocking poll() loops with a 100ms timeout to ensure clean and immediate shutdown.
    - Uses O_RDWR opening technique to keep a dummy writer in the daemon itself to avoid startup hangs and EOF reopening loops.
