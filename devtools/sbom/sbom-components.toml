# SBOM component manifest for the rsyslog source release.
#
# devtools/sbom/generate-sbom.py combines this file with the libraries it
# finds in configure.ac and the non-test Makefile.am files and writes a
# CycloneDX 1.6 SBOM for the release tarball.  See devtools/sbom/README.md.
#
# Keep this file in sync with the build system:
#   python3 devtools/sbom/generate-sbom.py --check
# fails when configure.ac or a Makefile.am names a library that is neither
# mapped to a [[dependency]] below nor listed in [ignore].

[project]
name = "rsyslog"
supplier = "The rsyslog project"
website = "https://www.rsyslog.com"
vcs = "https://github.com/rsyslog/rsyslog"
advisories = "https://github.com/rsyslog/rsyslog/security/advisories"
purl = "pkg:github/rsyslog/rsyslog"
# Most files are Apache-2.0; parts are GPL-3.0-or-later or LGPL-3.0-or-later.
# Per-file terms are in the SPDX headers and doc/source/licensing.rst.
license_expression = "Apache-2.0 AND GPL-3.0-or-later AND LGPL-3.0-or-later"
# Release tags are v<version>, e.g. v8.2612.0.
tag_prefix = "v"

# Names that are part of the C library or the operating system, not
# separately versioned third-party components.
[ignore]
names = [
    "anl", "dl", "door", "m", "nsl", "pthread", "resolv", "rt", "socket",
    "src",  # AIX system resource controller (tools/Makefile.am, AIX only)
]

# ---------------------------------------------------------------------------
# Code copied into the source tree.  It ships inside the tarball, so it is a
# required component of every build that compiles the listed files.
# "paths" must exist; --check verifies that.  "license" is an SPDX id; use
# "license_name" instead for terms without one (e.g. public domain).
# ---------------------------------------------------------------------------

[[vendored]]
name = "hashtable"
supplier = "Christopher Clark"
license = "BSD-3-Clause"
website = "http://www.cl.cam.ac.uk/~cwc22/hashtable/"
description = "Generic hash table, copied into the runtime."
paths = [
    "runtime/hashtable.c",
    "runtime/hashtable.h",
    "runtime/hashtable_itr.c",
    "runtime/hashtable_itr.h",
    "runtime/hashtable_private.h",
]

[[vendored]]
name = "siphash"
supplier = "Jean-Philippe Aumasson, Daniel J. Bernstein"
license = "CC0-1.0"
website = "https://github.com/veorq/SipHash"
description = "SipHash reference implementation used by imfile."
paths = ["plugins/imfile/siphash.c"]

[[vendored]]
name = "getifaddrs-compat"
supplier = "Oracle and/or its affiliates"
license = "CDDL-1.0"
description = "getifaddrs() replacement for Solaris, built only there."
paths = ["compat/getifaddrs.c", "compat/ifaddrs.h"]

[[vendored]]
name = "solaris-log-door"
supplier = "Sun Microsystems, Inc."
license = "CDDL-1.0"
description = "Solaris log device and door handling used by imsolaris (Solaris only)."
paths = ["plugins/imsolaris/sun_cddl.c"]

[[vendored]]
name = "wikibooks-base64-decode"
supplier = "Wikibooks contributors"
license_name = "Public Domain"
website = "https://en.wikibooks.org/wiki/Algorithm_Implementation/Miscellaneous/Base64"
description = "base64_decode() in grammar/rainerscript.c."
paths = ["grammar/rainerscript.c"]

[[vendored]]
name = "bsd-syslogd-pri-filter"
supplier = "The Regents of the University of California"
license = "BSD-3-Clause"
website = "https://github.com/troglobit/sysklogd"
description = "PRI selector parser descended from Berkeley syslogd via sysklogd."
paths = ["runtime/pri-filter.c"]

# The three JavaScript files are only used by the HTML documentation build.
# Keep versions equal to doc/source/_static/vendor/README.md (--check).
[[vendored]]
name = "d3"
version = "7.9.0"
license = "BSD-3-Clause"
purl = "pkg:npm/d3@7.9.0"
website = "https://d3js.org"
description = "Documentation only (Mermaid diagrams)."
paths = ["doc/source/_static/vendor/d3/d3.min.js"]

[[vendored]]
name = "mermaid"
version = "11.2.0"
license = "MIT"
purl = "pkg:npm/mermaid@11.2.0"
website = "https://mermaid.js.org"
description = "Documentation only (Mermaid diagrams)."
paths = [
    "doc/source/_static/vendor/mermaid/mermaid.min.js",
    "doc/source/_static/vendor/mermaid/mermaid.esm.min.mjs",
]

[[vendored]]
name = "@mermaid-js/layout-elk"
version = "0.1.4"
license = "MIT"
purl = "pkg:npm/%40mermaid-js/layout-elk@0.1.4"
website = "https://github.com/mermaid-js/mermaid"
description = "Documentation only (Mermaid diagrams)."
paths = [
    "doc/source/_static/vendor/mermaid/mermaid-layout-elk.min.js",
    "doc/source/_static/vendor/mermaid/mermaid-layout-elk.esm.min.mjs",
]

# ---------------------------------------------------------------------------
# External libraries.  They are not in the tarball; the builder links the
# version installed on the build system.  "match" lists every pkg-config
# module and linker name (-l<name>) the build system uses for the library.
# "required = true" marks libraries without which rsyslog does not build;
# everything else is needed only by optional modules or features.
# "declared = true" adds a library that the scanner cannot detect.
# The configure options that pull in an optional library are read from
# configure.ac; "configure_options" adds them for declared libraries.
# GNU ld "-l:<file>" entries are matched by the file name without the
# "lib" prefix, the ".a"/".so" suffix and a "-static" suffix, e.g.
# -l:librdkafka-static.a matches "rdkafka".
# ---------------------------------------------------------------------------

[[dependency]]
name = "libestr"
match = ["libestr", "estr"]
required = true
purl = "pkg:github/rsyslog/libestr"
website = "https://github.com/rsyslog/libestr"

[[dependency]]
