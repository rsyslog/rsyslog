---
name: draft source release

on:
  push:
    tags:
      - 'v8.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Optional tag name for manual draft-release tests
        required: false
        type: string
      target_commitish:
        description: >-
          Optional branch or commit SHA to use when a manual draft release
          must create its tag remotely
        required: false
        type: string
      create_draft_release:
        description: Create or update a draft GitHub release after building
        required: false
        default: false
        type: boolean

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{
    github.ref_name || github.event.inputs.tag_name || github.run_id }}
  cancel-in-progress: false

env:
  # Reuse only the shared make dist helper function from this script.
  # This workflow does not run Debian packaging steps or build .deb artifacts.
  DEBIAN_CI_HELPER: .github/scripts/debian_package_build.sh

jobs:
  build_release_artifacts:
    name: build release artifacts
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'rsyslog/rsyslog' }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup make dist build env
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf-archive \
            libestr-dev \
            libglib2.0-dev \
            libgnutls28-dev \
            liblognorm-dev \
            liblz4-dev \
            libnet1-dev \
            librelp-dev \
            libssl-dev \
            libsystemd-dev \
            libtool \
            libtool-bin \
            libyaml-dev \
            libzstd-dev \
            lsof \
            make \
            net-tools \
            pkg-config \
            python3-docutils \
            software-properties-common \
            zstd

      - name: Build maintainer tarball
        run: |
          set -euo pipefail
          rm -f rsyslog-*.tar.gz rsyslog-*.tar.gz.sha256
          # This calls only run_dist_build, which wraps autoreconf/configure/make dist.
          # It does not fetch Debian packaging or invoke any package build steps.
          "$GITHUB_WORKSPACE/$DEBIAN_CI_HELPER" run_dist_build \
            "$GITHUB_WORKSPACE"

      - name: Generate checksum and locate assets
        id: dist_assets
        run: |
          set -euo pipefail
          shopt -s nullglob

          tarballs=(rsyslog-*.tar.gz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly one rsyslog-*.tar.gz artifact" >&2
            ls -1 rsyslog-*.tar.gz 2>/dev/null || true
            exit 1
          fi

          dist_tarball="${tarballs[0]}"
          sha256sum "$dist_tarball" > "$dist_tarball.sha256"

          printf 'dist_tarball=%s\n' "$dist_tarball" >> "$GITHUB_OUTPUT"
          printf 'dist_tarball_sha256=%s\n' "$dist_tarball.sha256" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM
        id: sbom
        env:
          DIST_TARBALL: ${{ steps.dist_assets.outputs.dist_tarball }}
        run: |
          set -euo pipefail
          # CycloneDX SBOM of the source tarball; see devtools/sbom/README.md.
          # The timestamp is the release commit time so reruns produce the
          # same file.
          version="${DIST_TARBALL#rsyslog-}"
          version="${version%.tar.gz}"
          sbom="$DIST_TARBALL.cdx.json"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            python3 devtools/sbom/generate-sbom.py \
              --version "$version" \
              --tarball "$DIST_TARBALL" \
              --output "$sbom"
          printf 'sbom=%s\n' "$sbom" >> "$GITHUB_OUTPUT"

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: draft-release-assets
          path: |
            ${{ steps.dist_assets.outputs.dist_tarball }}
            ${{ steps.dist_assets.outputs.dist_tarball_sha256 }}
            ${{ steps.sbom.outputs.sbom }}
          if-no-files-found: error

  attest_release_artifacts:
    name: attest release artifacts
    runs-on: ubuntu-latest
    needs: build_release_artifacts
    # Attest only real release tags, not manual test runs.  This job runs no
    # repository code: it only signs the files built above.
    if: ${{ github.repository == 'rsyslog/rsyslog' && github.event_name == 'push' }}
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Require an official release tag
        run: |
          set -euo pipefail
          # Same rule as update_draft_release: sign only tags it will release.
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v8\.[0-9]{4}\.[0-9]+$ ]]; then
            echo "ERROR: tag '${GITHUB_REF_NAME}' is not an official release tag; not attesting" >&2
            exit 1
          fi

      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: draft-release-assets
          path: release-assets

      - name: Locate assets
        id: assets
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          tarballs=(rsyslog-*.tar.gz)
          sboms=(rsyslog-*.tar.gz.cdx.json)
          if [ "${#tarballs[@]}" -ne 1 ] || [ "${#sboms[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly one tarball and one SBOM" >&2
            exit 1
          fi
          sha256sum -c rsyslog-*.tar.gz.sha256
          printf 'tarball=%s\n' "release-assets/${tarballs[0]}" >> "$GITHUB_OUTPUT"
          printf 'sbom=%s\n' "release-assets/${sboms[0]}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.assets.outputs.tarball }}

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.assets.outputs.tarball }}
          sbom-path: ${{ steps.assets.outputs.sbom }}

  update_draft_release:
    name: update draft release
    runs-on: ubuntu-latest
    needs:
      - build_release_artifacts
      - attest_release_artifacts
    # attest_release_artifacts is skipped for manual runs; failed
    # attestations stop the release.
    if: >-
      ${{ always() &&
      github.repository == 'rsyslog/rsyslog' &&
      needs.build_release_artifacts.result == 'success' &&
      (needs.attest_release_artifacts.result == 'success' ||
      needs.attest_release_artifacts.result == 'skipped') &&
      (github.event_name == 'push' || github.event.inputs.create_draft_release == 'true') }}
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: draft-release-assets
          path: release-assets

      - name: Resolve release tag
        id: release_tag
        env:
          MANUAL_TAG_NAME: ${{ github.event.inputs.tag_name }}
        run: |
          set -euo pipefail

          official_tag_re='^v8\.[0-9]{4}\.[0-9]+$'
          manual_tag_re='^(v8\.[0-9]{4}\.[0-9]+|test-release-.*)$'

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            release_tag="${GITHUB_REF_NAME}"
            if [[ ! "$release_tag" =~ $official_tag_re ]]; then
              echo "ERROR: pushed tag '$release_tag' does not match ^v8\\.[0-9]{4}\\.[0-9]+$" >&2
              exit 1
            fi
          else
            release_tag="${MANUAL_TAG_NAME:-}"
            if [ -z "$release_tag" ]; then
              echo "ERROR: workflow_dispatch requires inputs.tag_name when create_draft_release=true" >&2
              exit 1
            fi
            if [[ ! "$release_tag" =~ $manual_tag_re ]]; then
              echo "ERROR: manual tag '$release_tag' must be an official v8.yymm.patch tag or start with test-release-" >&2
              exit 1
            fi
          fi

          printf 'release_tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"

      - name: Validate downloaded assets
        id: asset_paths
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob

          tarballs=(rsyslog-*.tar.gz)
          checksums=(rsyslog-*.tar.gz.sha256)
          sboms=(rsyslog-*.tar.gz.cdx.json)

          if [ "${#tarballs[@]}" -ne 1 ] || [ "${#checksums[@]}" -ne 1 ] || [ "${#sboms[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly one tarball, checksum file and SBOM" >&2
            find . -maxdepth 1 -type f -printf '%P\n' | sort
            exit 1
          fi

          sha256sum -c "${checksums[0]}"

          {
            printf 'tarball_path=%s\n' "release-assets/${tarballs[0]}"
            printf 'checksum_path=%s\n' "release-assets/${checksums[0]}"
            printf 'sbom_path=%s\n' "release-assets/${sboms[0]}"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.release_tag }}
          TARGET_COMMITISH: ${{ github.event.inputs.target_commitish }}
          TARBALL_PATH: ${{ steps.asset_paths.outputs.tarball_path }}
          CHECKSUM_PATH: ${{ steps.asset_paths.outputs.checksum_path }}
          SBOM_PATH: ${{ steps.asset_paths.outputs.sbom_path }}
        run: |
          set -euo pipefail

          cat > release-notes.md <<'EOF'
          This draft release includes the maintainer-built `rsyslog-*.tar.gz`
          source tarball produced by `make dist`.

          These uploaded assets are the official source-release artifacts for
          this draft and are distinct from GitHub's auto-generated source
          snapshots.

          The `.cdx.json` file is a CycloneDX SBOM of the source tarball.
          EOF

          # Attestations exist only for tag pushes (attest_release_artifacts).
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            cat >> release-notes.md <<'EOF'

          The tarball carries signed build provenance and SBOM attestations;
          verify them with:

              gh attestation verify rsyslog-<version>.tar.gz -R rsyslog/rsyslog
              gh attestation verify rsyslog-<version>.tar.gz -R rsyslog/rsyslog \
                  --predicate-type https://cyclonedx.org/bom
          EOF
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --draft \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md
          else
            create_args=(
              "$RELEASE_TAG"
              --draft
              --title "$RELEASE_TAG"
              --notes-file release-notes.md
            )

            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              create_args+=(--verify-tag)
            else
              if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
                echo "ERROR: expected pushed tag '$RELEASE_TAG' to exist remotely" >&2
                exit 1
              fi
              if [ -z "${TARGET_COMMITISH:-}" ]; then
                echo "ERROR: inputs.target_commitish is required when creating a manual release for a missing tag" >&2
                exit 1
              fi
              create_args+=(--target "$TARGET_COMMITISH")
            fi

            gh release create "${create_args[@]}"
          fi

          gh release upload "$RELEASE_TAG" \
            "$TARBALL_PATH" \
            "$CHECKSUM_PATH" \
            "$SBOM_PATH" \
            --clobber
