---
name: imtcp session fuzzing

'on':
  pull_request:
    paths:
      - '.github/workflows/imtcp_session_fuzz.yml'
      - 'configure.ac'
      - 'devtools/devcontainer.sh'
      - 'devtools/run-configure.sh'
      - 'plugins/imtcp/**'
      - 'runtime/**'
      - 'tests/Makefile.am'
      - 'tests/fuzz-imtcp-session-smoke.sh'
      - 'tests/fuzz/prepare-imtcp-session-corpus.py'
      - 'tests/fuzz/corpus/imtcp-session/**'
      - 'tools/Makefile.am'
      - 'tools/fuzz_imtcp_session.c'
  schedule:
    # Run after the parser fuzzer. Each run restores the latest evolving corpus
    # and explores it further, including when the source revision is unchanged.
    - cron: '27 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RSYSLOG_UPLOAD_FAILURE_ARTIFACTS: '1'

jobs:
  pr_smoke:
    name: imtcp session fuzz smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build instrumented fuzzer
        env:
          CC: clang-21
          CFLAGS: >-
            -O1 -g -fno-omit-frame-pointer
            -fsanitize=fuzzer-no-link,address,undefined
            -fno-sanitize=function
          LDFLAGS: >-
            -fsanitize=address,undefined
            -fno-sanitize=function
          RSYSLOG_CONFIGURE_OPTIONS_EXTRA: >-
            --enable-debug --enable-testbench --enable-imdiag
            --enable-fuzzing --disable-elasticsearch-tests
            --disable-kafka-tests --disable-libfaketime
            --without-valgrind-testbench --disable-valgrind
          RSYSLOG_DEV_CONTAINER: rsyslog/rsyslog_dev_base_ubuntu:26.04
        run: |
          devtools/devcontainer.sh --rm bash -lc '
            set -e
            autoreconf -fvi
            devtools/run-configure.sh
            make -j10
          '

      - name: Run bounded imtcp session fuzz smoke
        id: smoke
        env:
          RSYSLOG_DEV_CONTAINER: rsyslog/rsyslog_dev_base_ubuntu:26.04
        run: |
          devtools/devcontainer.sh --rm bash -lc '
            set -e
            export ASAN_OPTIONS=detect_leaks=1:abort_on_error=1
            export UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1
            devtools/ci-flake-phase.sh run imtcp-session-fuzz-smoke custom -- \
              ./tests/fuzz-imtcp-session-smoke.sh
          '

      - name: Upload fuzzer crash artifacts
        if: failure() && steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: imtcp-session-fuzz-smoke-artifacts-${{ github.run_id }}
          path: fuzz-imtcp-session-work.*
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload test failure evidence
        if: >-
          failure() &&
          steps.smoke.outcome == 'failure' &&
          env.RSYSLOG_UPLOAD_FAILURE_ARTIFACTS == '1'
        uses: ./.github/actions/upload-flake-evidence
        with:
          job-name: imtcp-session-fuzz-smoke

  daily:
    name: daily imtcp session fuzzing
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore evolving corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz-imtcp-corpus-work
          key: >-
            imtcp-session-fuzz-corpus-v1-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            imtcp-session-fuzz-corpus-v1-${{ github.sha }}-
            imtcp-session-fuzz-corpus-v1-

      - name: Build instrumented fuzzer
        env:
          CC: clang-21
          CFLAGS: >-
            -O1 -g -fno-omit-frame-pointer
            -fsanitize=fuzzer-no-link,address,undefined
            -fno-sanitize=function
          LDFLAGS: >-
            -fsanitize=address,undefined
            -fno-sanitize=function
          RSYSLOG_CONFIGURE_OPTIONS_EXTRA: >-
            --enable-debug --enable-testbench --enable-imdiag
            --enable-fuzzing --disable-elasticsearch-tests
            --disable-kafka-tests --disable-libfaketime
            --without-valgrind-testbench --disable-valgrind
          RSYSLOG_DEV_CONTAINER: rsyslog/rsyslog_dev_base_ubuntu:26.04
        run: |
          mkdir -p fuzz-artifacts fuzz-imtcp-corpus-work
          python3 tests/fuzz/prepare-imtcp-session-corpus.py \
            tests/fuzz/corpus/imtcp-session fuzz-imtcp-corpus-work
          devtools/devcontainer.sh --rm bash -lc '
            set -e
            autoreconf -fvi
            devtools/run-configure.sh
            make -j10
          '

      - name: Run daily imtcp session fuzz campaign
        id: fuzz
        env:
          RSYSLOG_DEV_CONTAINER: rsyslog/rsyslog_dev_base_ubuntu:26.04
        run: |
          devtools/devcontainer.sh --rm bash -lc '
            set -e
            export ASAN_OPTIONS=detect_leaks=1:abort_on_error=1
            export UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1
            devtools/ci-flake-phase.sh run imtcp-session-fuzz-daily custom -- \
              ./tools/fuzz_imtcp_session \
                -max_total_time=600 \
                -max_len=65536 \
                -timeout=5 \
                -rss_limit_mb=2048 \
                -artifact_prefix=fuzz-artifacts/ \
                fuzz-imtcp-corpus-work
          '

      - name: Save evolving corpus
        if: steps.fuzz.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz-imtcp-corpus-work
          key: >-
            imtcp-session-fuzz-corpus-v1-${{ github.sha }}-${{ github.run_id }}

      - name: Upload fuzzer artifacts
        if: failure() && hashFiles('fuzz-artifacts/*') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: imtcp-session-fuzz-artifacts-${{ github.run_id }}
          path: fuzz-artifacts
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload test failure evidence
        if: >-
          failure() &&
          steps.fuzz.outcome == 'failure' &&
          env.RSYSLOG_UPLOAD_FAILURE_ARTIFACTS == '1'
        uses: ./.github/actions/upload-flake-evidence
        with:
          job-name: imtcp-session-fuzz-daily
