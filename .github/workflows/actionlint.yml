---
name: Workflow Lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ${{ github.event.repository.private && (vars.RSYSLOG_CI_LINUX_RUNNER || 'private-runner-unconfigured') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint GitHub Actions workflows
        uses: reviewdog/action-actionlint@a7d35aaf8c309203a4ae861d32b7bd490baa7bf3 # v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          filter_mode: file
          fail_level: any
      - name: Check flake-evidence coverage
        run: python3 devtools/check-flake-evidence-coverage.py
