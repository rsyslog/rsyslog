---
name: fedora 44 daily stable

'on':
  workflow_dispatch:
    inputs:
      source_ref:
        description: rsyslog source branch, tag, or commit to package
        required: true
        default: main
        type: string
      publish_to_archive:
        description: Publish a signed bundle to the packages.rsyslog.com archive
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '47 5 * * *'

concurrency:
  group: fedora44-daily-stable
  cancel-in-progress: false

env:
  FEDORA_DAILY_STABLE_HELPER: devtools/release/fedora-daily-stable.sh
  FEDORA_POLICY_FILE: .github/fedora44-daily-stable-policy.yml
  PACKAGE_FEATURE_CONTRACT: .github/daily-stable-package-features.yml
  PACKAGE_REPOSITORY_ARCHITECTURES: x86_64 aarch64
  PACKAGE_CHANNEL: daily-stable
  PACKAGE_DISTRO: fedora
  PACKAGE_DISTRO_VERSION: '44'
  ARCHIVE_PREFIX: rpm/daily-stable/fedora/44
  ARCHIVE_PUBLIC_URL: https://packages.rsyslog.com/rpm/daily-stable/fedora/44

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-24.04
    if: github.repository == 'rsyslog/rsyslog'
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.decision.outputs.should_run }}
      should_publish: ${{ steps.decision.outputs.should_publish }}
      source_ref: ${{ steps.decision.outputs.source_ref }}
    steps:
      - name: Decide whether this run is active
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PUBLISH: ${{ inputs.publish_to_archive }}
          MANUAL_SOURCE_REF: ${{ inputs.source_ref }}
          SCHEDULE_ENABLED: ${{ vars.FEDORA44_DAILY_STABLE_ENABLED }}
        run: |
          set -euo pipefail
          should_run=false
          should_publish=false
          source_ref=main
          case "$EVENT_NAME" in
            workflow_dispatch)
              should_run=true
              source_ref="${MANUAL_SOURCE_REF:-main}"
              if [ "${MANUAL_PUBLISH:-false}" = true ]; then
                should_publish=true
              fi
              ;;
            schedule)
              case "${SCHEDULE_ENABLED:-}" in
                true)
                  should_run=true
                  should_publish=true
                  ;;
                false)
                  ;;
                *)
                  echo "::error::FEDORA44_DAILY_STABLE_ENABLED must be a repository variable set to true or false"
                  exit 1
                  ;;
              esac
              ;;
          esac
          {
            echo "should_run=$should_run"
            echo "should_publish=$should_publish"
            echo "source_ref=$source_ref"
          } >> "$GITHUB_OUTPUT"

  build:
    name: build Fedora 44 ${{ matrix.arch }} packages
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      RPM_ARCH: ${{ matrix.arch }}
    outputs:
      archive_date: ${{ steps.version.outputs.archive_date }}
      expected_evr: ${{ steps.version.outputs.expected_evr }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Checkout archive automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout source to package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: rsyslog-source
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.source_ref }}

      - name: Record packaged source revision
        id: source
        run: |
          set -euo pipefail
          source_sha="$(git -C rsyslog-source rev-parse HEAD)"
          # Lets the baseline patch policy recognize distribution backports
          # of commits that the packaged source already contains.
          git -C rsyslog-source log --format='%H %s' HEAD \
            > "$RUNNER_TEMP/upstream-commits.txt"
          echo "RSYSLOG_UPSTREAM_COMMIT_INDEX=$RUNNER_TEMP/upstream-commits.txt" \
            >> "$GITHUB_ENV"
          {
            echo "source_sha=$source_sha"
            echo "SOURCE_GIT_SHA=$source_sha"
            echo "RSYSLOG_SOURCE_DIR=$GITHUB_WORKSPACE/rsyslog-source"
          } | tee -a "$GITHUB_ENV" >> "$GITHUB_OUTPUT"

      - name: Generate daily package version
        id: version
        run: "$FEDORA_DAILY_STABLE_HELPER version"

      - name: Generate rsyslog dist tarball
        run: |
          case "$RPM_ARCH" in
            x86_64)
              RSYSLOG_HOME="$GITHUB_WORKSPACE/rsyslog-source" \
                RSYSLOG_DEV_CONTAINER=rsyslog/rsyslog_dev_base_ubuntu:26.04 \
                devtools/devcontainer.sh --rm \
                  .github/scripts/debian_package_build.sh run_dist_build \
                  /rsyslog
              ;;
            aarch64)
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends \
                autoconf autoconf-archive automake bison build-essential \
                flex gawk git libestr-dev libfastjson-dev libsystemd-dev \
                libtool libyaml-dev pkg-config python3-docutils zlib1g-dev
              .github/scripts/debian_package_build.sh run_dist_build \
                "$GITHUB_WORKSPACE/rsyslog-source"
              ;;
          esac
          dist_tarball="$(
            find rsyslog-source -maxdepth 1 -type f \
              -name 'rsyslog-*.tar.gz' -print -quit
          )"
          [ -n "$dist_tarball" ]
          echo "DIST_TARBALL=$GITHUB_WORKSPACE/$dist_tarball" >> "$GITHUB_ENV"

      - name: Fetch native baseline and build Fedora RPMs
        id: package_build
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE: ${{ steps.version.outputs.release }}
          EXPECTED_EVR: ${{ steps.version.outputs.expected_evr }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fedora44-build"
          devtools/ci-flake-phase.sh begin fedora44-package-build custom
          set +e
          docker run --rm \
            -e FEDORA_DAILY_STABLE_HELPER -e PACKAGE_FEATURE_CONTRACT \
            -e FEDORA_POLICY_FILE -e EXPECTED_EVR -e RELEASE -e RPM_ARCH \
            -e VERSION \
            -e "DIST_TARBALL=/workspace/rsyslog-source/$(basename "$DIST_TARBALL")" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -e RSYSLOG_UPSTREAM_COMMIT_INDEX=/runner-temp/upstream-commits.txt \
            -v "$RUNNER_TEMP:/runner-temp" \
            -w /workspace \
            fedora:44 bash -lc '
              set -euo pipefail
              dnf -q -y install \
                dnf5-plugins findutils gzip python3 rpm-build tar >/dev/null
              mkdir -p /runner-temp/fedora44-baseline/download \
                /runner-temp/fedora44-baseline/rpmbuild
              dnf -q -y download --source \
                --destdir /runner-temp/fedora44-baseline/download \
                rsyslog >/dev/null
              baseline_srpm="$(
                find /runner-temp/fedora44-baseline/download \
                  -maxdepth 1 -type f -name "rsyslog-*.src.rpm" -print -quit
              )"
              [ -n "$baseline_srpm" ]
              rpm -qp --qf "%{NAME}-%{VERSION}-%{RELEASE}.src\n" \
                "$baseline_srpm" \
                > /runner-temp/fedora44-baseline-nevra
              sha256sum "$baseline_srpm" | awk "{print \$1}" \
                > /runner-temp/fedora44-baseline-sha256
              rpm -ivh \
                --define "_topdir /runner-temp/fedora44-baseline/rpmbuild" \
                "$baseline_srpm" >/dev/null
              "$FEDORA_DAILY_STABLE_HELPER" prepare-sources \
                /runner-temp/fedora44-baseline/rpmbuild \
                "$DIST_TARBALL" \
                /runner-temp/fedora44-prepared \
                "$FEDORA_POLICY_FILE" \
                "$PACKAGE_FEATURE_CONTRACT" \
                "$VERSION" \
                "$RELEASE"
              "$FEDORA_DAILY_STABLE_HELPER" build-package \
                /runner-temp/fedora44-prepared \
                /runner-temp/fedora44-artifacts \
                /runner-temp/fedora44-build.log \
                "$EXPECTED_EVR" \
                "$RPM_ARCH"
            '
          build_status=$?
          set -e
          devtools/ci-flake-phase.sh end \
            fedora44-package-build custom "$build_status"
          if [ "$build_status" -eq 0 ]; then
            sudo chown -R "$(id -u):$(id -g)" \
              "$RUNNER_TEMP/fedora44-artifacts" \
              "$RUNNER_TEMP/fedora44-build.log" \
              "$RUNNER_TEMP/fedora44-baseline-nevra" \
              "$RUNNER_TEMP/fedora44-baseline-sha256"
            cp -a "$RUNNER_TEMP/fedora44-artifacts" \
              fedora44-daily-stable-artifacts
            {
              echo "baseline_nevra=$(cat "$RUNNER_TEMP/fedora44-baseline-nevra")"
              echo "baseline_sha256=$(cat "$RUNNER_TEMP/fedora44-baseline-sha256")"
            } >> "$GITHUB_OUTPUT"
          fi
          exit "$build_status"

      - name: Upload package-build failure evidence
        if: failure() && steps.package_build.outcome == 'failure'
        uses: $/.github/actions/upload-flake-evidence
        with:
          job-name: Fedora 44 daily stable package build

      - name: Generate artifact manifest
        env:
          EXPECTED_EVR: ${{ steps.version.outputs.expected_evr }}
        run: |
          "$FEDORA_DAILY_STABLE_HELPER" manifest \
            fedora44-daily-stable-artifacts \
            "$EXPECTED_EVR" \
            "$RPM_ARCH" \
            "$PACKAGE_CHANNEL" \
            "$PACKAGE_DISTRO" \
            "$PACKAGE_DISTRO_VERSION"

      - name: Upload Fedora package artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fedora44-daily-stable-${{ steps.version.outputs.expected_evr }}-${{ matrix.arch }}
          path: fedora44-daily-stable-artifacts/
          retention-days: 14
          if-no-files-found: error

      - name: Summarize build
        env:
          BASELINE_NEVRA: ${{ steps.package_build.outputs.baseline_nevra }}
          BASELINE_SHA256: ${{ steps.package_build.outputs.baseline_sha256 }}
          EXPECTED_EVR: ${{ steps.version.outputs.expected_evr }}
          SOURCE_REF: ${{ needs.preflight.outputs.source_ref }}
        run: |
          {
            echo '### Fedora 44 daily stable build'
            echo
            echo "- EVR: \`$EXPECTED_EVR\`"
            echo "- Source ref: \`$SOURCE_REF\`"
            echo "- Source commit: \`$SOURCE_GIT_SHA\`"
            echo "- Fedora source RPM: \`$BASELINE_NEVRA\`"
            echo "- Baseline SHA-256: \`$BASELINE_SHA256\`"
            echo "- Archive prefix: \`$ARCHIVE_PREFIX\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: build signed Fedora RPM archive publication
    needs: [preflight, build]
    if: needs.preflight.outputs.should_publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # This legacy-named environment is the security boundary for the shared
    # package archive, not a Debian-only destination.
    environment: debian-daily-stable
    permissions:
      contents: read
    outputs:
      manifest_sha256: ${{ steps.bundle.outputs.manifest_sha256 }}
      run_attempt: ${{ steps.bundle.outputs.run_attempt }}
    env:
      ARCHIVE_GPG_PRIVATE_KEY: ${{ secrets.DEBIAN_DAILY_STABLE_GPG_PRIVATE_KEY }}
      ARCHIVE_GPG_PASSPHRASE: ${{ secrets.DEBIAN_DAILY_STABLE_GPG_PASSPHRASE }}
      ARCHIVE_GPG_FINGERPRINT: ${{ vars.DEBIAN_DAILY_STABLE_GPG_FINGERPRINT }}
      # Public half of ARCHIVE_PUBLICATION_SIGNING_KEY; the server poller
      # trusts it for principal and namespace rsyslog-archive-publication.
      ARCHIVE_PUBLICATION_PUBLIC_KEY: >-
        ssh-ed25519
        AAAAC3NzaC1lZDI1NTE5AAAAICavKojThGK0MaNgezhI6qnU8dlrjC9d+Pqv8nQ60QnB
    steps:
      - name: Checkout archive automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install RPM repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            createrepo-c curl gnupg openssh-client python3 rpm

      - name: Validate archive configuration
        run: |
          set -euo pipefail
          for variable in \
            ARCHIVE_PREFIX ARCHIVE_PUBLIC_URL ARCHIVE_GPG_PRIVATE_KEY \
            ARCHIVE_GPG_FINGERPRINT; do
            [ -n "${!variable:-}" ] || {
              echo "$variable is empty" >&2
              exit 1
            }
          done

      - name: Download Fedora x86_64 package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fedora44-daily-stable-${{ needs.build.outputs.expected_evr }}-x86_64
          path: fedora44-daily-stable-artifacts/x86_64

      - name: Download Fedora aarch64 package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fedora44-daily-stable-${{ needs.build.outputs.expected_evr }}-aarch64
          path: fedora44-daily-stable-artifacts/aarch64

      - name: Verify artifact checksums
        run: |
          for arch in $PACKAGE_REPOSITORY_ARCHITECTURES; do
            (cd "fedora44-daily-stable-artifacts/$arch" && sha256sum -c SHA256SUMS)
          done

      - name: Import signing key and unlock its agent
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.gnupg"
          echo allow-preset-passphrase > "$HOME/.gnupg/gpg-agent.conf"
          gpgconf --kill gpg-agent || true
          printf '%s\n' "$ARCHIVE_GPG_PRIVATE_KEY" | gpg --batch --import
          keygrip="$(
            gpg --batch --with-colons --with-keygrip --list-secret-keys \
              "$ARCHIVE_GPG_FINGERPRINT" |
              awk -F: '$1 == "grp" { print $10; exit }'
          )"
          [ -n "$keygrip" ]
          preset_tool="$(command -v gpg-preset-passphrase || true)"
          for candidate in \
            /usr/lib/gnupg2/gpg-preset-passphrase \
            /usr/lib/gnupg/gpg-preset-passphrase; do
            if [ -z "$preset_tool" ] && [ -x "$candidate" ]; then
              preset_tool="$candidate"
            fi
          done
          [ -n "$preset_tool" ]
          printf '%s' "$ARCHIVE_GPG_PASSPHRASE" |
            "$preset_tool" --preset "$keygrip"
          passphrase_file="$RUNNER_TEMP/archive-gpg-passphrase"
          install -m 600 /dev/null "$passphrase_file"
          printf '%s' "$ARCHIVE_GPG_PASSPHRASE" > "$passphrase_file"
          echo "GPG_PASSPHRASE_FILE=$passphrase_file" >> "$GITHUB_ENV"

      - name: Check archive signing key expiry
        run: >-
          devtools/release/check-signing-key-expiry.sh
          "$ARCHIVE_GPG_FINGERPRINT" 60

      - name: Sign binary and source RPMs
        run: |
          for arch in $PACKAGE_REPOSITORY_ARCHITECTURES; do
            "$FEDORA_DAILY_STABLE_HELPER" sign-rpms \
              "fedora44-daily-stable-artifacts/$arch" \
              "$ARCHIVE_GPG_FINGERPRINT"
          done

      - name: Download and verify current repository metadata
        run: |
          # Each published repomd.xml must verify with the archive key and
          # every file it lists must match; only HTTP 404 (empty prefix)
          # starts a repository from scratch.
          # shellcheck disable=SC2086 # repository list is word-split
          "$FEDORA_DAILY_STABLE_HELPER" fetch-verified-metadata \
            "$ARCHIVE_PUBLIC_URL" \
            rpm-repo \
            "$ARCHIVE_GPG_FINGERPRINT" \
            $PACKAGE_REPOSITORY_ARCHITECTURES SRPMS

      - name: Generate signed incremental RPM repositories
        run: |
          for arch in $PACKAGE_REPOSITORY_ARCHITECTURES; do
            "$FEDORA_DAILY_STABLE_HELPER" generate-repo \
              "fedora44-daily-stable-artifacts/$arch" \
              rpm-repo \
              "$arch" \
              "$ARCHIVE_GPG_FINGERPRINT" \
              "$GPG_PASSPHRASE_FILE"
          done

      - name: Generate signed artifact manifest and snapshot
        env:
          ARCHIVE_DATE: ${{ needs.build.outputs.archive_date }}
          EXPECTED_EVR: ${{ needs.build.outputs.expected_evr }}
        run: |
          snapshot_dir="rpm-repo/snapshots/$ARCHIVE_DATE/$EXPECTED_EVR"
          for arch in $PACKAGE_REPOSITORY_ARCHITECTURES; do
            artifact_dir="fedora44-daily-stable-artifacts/$arch"
            "$FEDORA_DAILY_STABLE_HELPER" manifest \
              "$artifact_dir" \
              "$EXPECTED_EVR" "$arch" "$PACKAGE_CHANNEL" \
              "$PACKAGE_DISTRO" "$PACKAGE_DISTRO_VERSION"
            mkdir -p "$snapshot_dir/$arch"
            cp -a "$artifact_dir/manifest.json" \
              "$artifact_dir/SHA256SUMS" \
              "$artifact_dir/build.log" \
              "$artifact_dir/rsyslog.spec" \
              "$snapshot_dir/$arch/"
          done

      - name: Generate repository configuration
        run: |
          cat > rpm-repo/rsyslog-daily-stable-fedora44.repo <<EOF
          [rsyslog-daily-stable]
          name=rsyslog daily stable for Fedora 44 - \$basearch
          baseurl=$ARCHIVE_PUBLIC_URL/\$basearch
          enabled=1
          gpgcheck=1
          repo_gpgcheck=1
          gpgkey=$ARCHIVE_PUBLIC_URL/rsyslog-archive-keyring.asc
          EOF

      - name: Collect archive publication
        run: |
          set -euo pipefail
          tool="$GITHUB_WORKSPACE/devtools/release/archive-publication.sh"
          bundle="$GITHUB_WORKSPACE/archive-publication"
          "$tool" init "$bundle" "$ARCHIVE_PREFIX" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"

          add() {
            "$tool" add "$1" "$bundle" "rpm-repo/$2" "$2"
          }
          add_found() {
            local kind="$1" path
            shift
            while IFS= read -r -d '' path; do
              add "$kind" "${path#rpm-repo/}"
            done < <(find "$@" -print0 | sort -z)
          }

          repo_subdirs="$PACKAGE_REPOSITORY_ARCHITECTURES SRPMS"
          # A repodata file is immutable only when createrepo_c named it
          # after its own SHA-256 (unique md filenames), so that the same
          # name can never carry other content.  Anything else is metadata.
          immutable_repodata=()
          mutable_repodata=()
          for repo_subdir in $repo_subdirs; do
            while IFS= read -r -d '' path; do
              name="${path##*/}"
              case "$name" in
                repomd.xml|repomd.xml.asc) continue ;;
              esac
              prefix_hash="${name%%-*}"
              if [[ "$prefix_hash" =~ ^[0-9a-f]{64}$ ]] &&
                 [ "$(sha256sum "$path" | awk '{print $1}')" = "$prefix_hash" ]; then
                immutable_repodata+=("$path")
              else
                echo "::notice::$path is not named by its SHA-256; publishing it as metadata"
                mutable_repodata+=("$path")
              fi
            done < <(find "rpm-repo/$repo_subdir/repodata" -type f -print0 | sort -z)
          done

          # Only this run's files: immutable objects first, then metadata
          # with each repomd.xml followed by its repomd.xml.asc, the last
          # entry being a repomd.xml.asc.
          add_found immutable rpm-repo/x86_64/Packages \
            rpm-repo/aarch64/Packages rpm-repo/SRPMS/Packages -type f
          add_found immutable rpm-repo/snapshots -type f
          for path in "${immutable_repodata[@]}"; do
            add immutable "${path#rpm-repo/}"
          done
          add metadata rsyslog-archive-keyring.asc
          add metadata rsyslog-daily-stable-fedora44.repo
          for path in "${mutable_repodata[@]}"; do
            add metadata "${path#rpm-repo/}"
          done
          for repo_subdir in $repo_subdirs; do
            add metadata "$repo_subdir/repodata/repomd.xml"
            add metadata "$repo_subdir/repodata/repomd.xml.asc"
          done

      - name: Sign archive publication
        id: bundle
        env:
          ARCHIVE_PUBLICATION_SIGNING_KEY: ${{ secrets.ARCHIVE_PUBLICATION_SIGNING_KEY }}
        run: |
          set -euo pipefail
          tool="$GITHUB_WORKSPACE/devtools/release/archive-publication.sh"
          bundle="$GITHUB_WORKSPACE/archive-publication"
          [ -n "${ARCHIVE_PUBLICATION_SIGNING_KEY:-}" ] || {
            echo "ARCHIVE_PUBLICATION_SIGNING_KEY is empty" >&2
            exit 1
          }
          key_file="$RUNNER_TEMP/archive-publication-key"
          trap 'rm -f "$key_file"' EXIT
          (
            umask 077
            printf '%s\n' "$ARCHIVE_PUBLICATION_SIGNING_KEY" > "$key_file"
          )
          "$tool" sign "$bundle" "$key_file"
          rm -f "$key_file"

          # Check the bundle the way the server poller will.
          printf 'rsyslog-archive-publication namespaces="rsyslog-archive-publication" %s\n' \
            "$ARCHIVE_PUBLICATION_PUBLIC_KEY" > "$RUNNER_TEMP/allowed_signers"
          "$tool" verify "$bundle" "$RUNNER_TEMP/allowed_signers"

          manifest_sha256="$(sha256sum "$bundle/manifest" | awk '{print $1}')"
          {
            echo "manifest_sha256=$manifest_sha256"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Fedora 44 archive publication"
            echo
            echo "- Artifact: \`archive-publication-fedora-44\`"
            echo "- Prefix: \`$ARCHIVE_PREFIX\`"
            echo "- Run: \`$GITHUB_RUN_ID\` attempt \`$GITHUB_RUN_ATTEMPT\`"
            echo "- Manifest SHA-256: \`$manifest_sha256\`"
            echo "- Files: $(($(wc -l < "$bundle/manifest") - 4))"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload archive publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-publication-fedora-44
          path: archive-publication/
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  verify:
    name: verify published Fedora 44 ${{ matrix.arch }} repository
    needs: [preflight, build, publish]
    if: needs.preflight.outputs.should_publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    container:
      image: fedora:44
      options: --user root
    permissions:
      contents: read
    env:
      RPM_ARCH: ${{ matrix.arch }}
      EXPECTED_GPG_FINGERPRINT: ${{ vars.DEBIAN_DAILY_STABLE_GPG_FINGERPRINT }}
      EXPECTED_EVR: ${{ needs.build.outputs.expected_evr }}
    steps:
      - name: Install container prerequisites
        run: |
          dnf -q -y install python3 tar
          dnf -q -y swap gnupg2-minimal gnupg2

      - name: Checkout archive automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Wait for the server to apply this publication
        id: publication_applied
        shell: bash
        env:
          PUBLICATION_ATTEMPT: ${{ needs.publish.outputs.run_attempt }}
          PUBLICATION_MANIFEST_SHA256: ${{ needs.publish.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          # Service readiness, not a test phase: kept outside ci-flake-phase.sh.
          # The poller on packages.rsyslog.com writes publication-status.json
          # after it has verified and applied a publication.  Wait up to 30
          # minutes for the one this run built.
          if [ -z "$PUBLICATION_ATTEMPT" ] || [ -z "$PUBLICATION_MANIFEST_SHA256" ]; then
            echo "publish job did not report its publication" >&2
            exit 1
          fi
          bash -euo pipefail <<'BASH'
          status_url="$ARCHIVE_PUBLIC_URL/publication-status.json"
          status_file="$RUNNER_TEMP/publication-status.json"
          expected="$GITHUB_RUN_ID $PUBLICATION_ATTEMPT $PUBLICATION_MANIFEST_SHA256"
          for attempt in $(seq 1 60); do
            applied=""
            if curl -fsSL -H 'Cache-Control: no-cache' \
              -o "$status_file" "$status_url"; then
              applied="$(
                python3 -I -c 'import json, sys
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          print(d.get("run"), d.get("attempt"), d.get("manifest_sha256"))' \
                  "$status_file"
              )" || applied=""
            fi
            if [ "$applied" = "$expected" ]; then
              echo "Publication applied: run $expected"
              exit 0
            fi
            echo "Publication not applied yet (server reports: ${applied:-none}), waiting ($attempt/60)..."
            if [ "$attempt" -lt 60 ]; then
              sleep 30
            fi
          done
          echo "The server did not apply this run's publication within 30 minutes." >&2
          exit 1
          BASH

      - name: Verify published repository and installation
        id: published_install
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/flake-evidence/logs
          devtools/ci-flake-phase.sh begin \
            fedora44-published-install custom
          set +e
          (
            set -euo pipefail
            for variable in ARCHIVE_PUBLIC_URL EXPECTED_EVR \
              EXPECTED_GPG_FINGERPRINT; do
              [ -n "${!variable:-}" ]
            done

            # verify-repo fetches the published key, checks its fingerprint
            # and the repomd.xml signature, and confirms the new EVR.
            verification_rc=1
            for attempt in $(seq 1 20); do
              if "$FEDORA_DAILY_STABLE_HELPER" verify-repo \
                "$ARCHIVE_PUBLIC_URL" "$RPM_ARCH" "$EXPECTED_EVR" \
                "$EXPECTED_GPG_FINGERPRINT"; then
                verification_rc=0
                break
              fi
              echo "Repository not ready yet, retrying ($attempt/20)..."
              [ "$attempt" -eq 20 ] || sleep 30
            done
            [ "$verification_rc" -eq 0 ]

            curl -fsSL "$ARCHIVE_PUBLIC_URL/rsyslog-archive-keyring.asc" \
              -o /tmp/rsyslog-archive-keyring.asc
            rpm --import /tmp/rsyslog-archive-keyring.asc
            # DNF, not this shell, expands the literal $basearch token.
            # shellcheck disable=SC2016
            printf '%s\n' \
              '[rsyslog-daily-stable]' \
              'name=rsyslog daily stable for Fedora 44 - $basearch' \
              "baseurl=$ARCHIVE_PUBLIC_URL/\$basearch" \
              'enabled=1' \
              'gpgcheck=1' \
              'repo_gpgcheck=1' \
              "gpgkey=$ARCHIVE_PUBLIC_URL/rsyslog-archive-keyring.asc" \
              > /etc/yum.repos.d/rsyslog-daily-stable.repo
            dnf -q -y makecache --refresh
            dnf -q -y install \
              "rsyslog-$EXPECTED_EVR" \
              "rsyslog-crypto-$EXPECTED_EVR" \
              "rsyslog-standard-$EXPECTED_EVR"
            for package in rsyslog rsyslog-crypto rsyslog-openssl rsyslog-gnutls \
              rsyslog-omotel rsyslog-standard; do
              installed_evr="$(
                rpm -q --qf '%{VERSION}-%{RELEASE}\n' "$package"
              )"
              [ "$installed_evr" = "$EXPECTED_EVR" ]
            done
            dnf -q -y install "rsyslog-full-$EXPECTED_EVR"
            full_requirements="$(rpm -q --requires rsyslog-full)"
            expected_full_requirements="$(
              printf '%s\n' \
                "rsyslog = $EXPECTED_EVR" \
                "rsyslog-openssl = $EXPECTED_EVR" \
                "rsyslog-gnutls = $EXPECTED_EVR" \
                "rsyslog-omotel = $EXPECTED_EVR" \
                "rsyslog-omazuredce = $EXPECTED_EVR" | sort
            )"
            actual_full_requirements="$(
              printf '%s\n' "$full_requirements" | grep '^rsyslog' | sort
            )"
            [ "$actual_full_requirements" = "$expected_full_requirements" ]
            for package in rsyslog rsyslog-crypto rsyslog-openssl \
              rsyslog-gnutls rsyslog-omotel rsyslog-omazuredce \
              rsyslog-standard rsyslog-full; do
              installed_evr="$(
                rpm -q --qf '%{VERSION}-%{RELEASE}\n' "$package"
              )"
              [ "$installed_evr" = "$EXPECTED_EVR" ]
            done
            for package_file in \
              rsyslog-openssl:lmnsd_ossl.so \
              rsyslog-gnutls:lmnsd_gtls.so \
              rsyslog-omotel:omotel.so \
              rsyslog-omazuredce:omazuredce.so; do
              package="${package_file%%:*}"
              module_file="${package_file#*:}"
              module_file="${module_file//./\\.}"
              rpm -ql "$package" | grep -Eq "/rsyslog/$module_file$"
            done
            rsyslogd -v
            devtools/release/package-feature-smoke.sh
          ) 2>&1 | tee \
            .ci/flake-evidence/logs/fedora44-published-install.log
          install_status=${PIPESTATUS[0]}
          set -e
          devtools/ci-flake-phase.sh end \
            fedora44-published-install custom "$install_status"
          exit "$install_status"

      - name: Upload publication failure evidence
        if: failure() && steps.published_install.outcome == 'failure'
        uses: $/.github/actions/upload-flake-evidence
        with:
          job-name: Fedora 44 daily stable verification

  report_failure:
    name: report failure
    needs: [preflight, build, publish, verify]
    if: >-
      always() &&
      github.event_name == 'schedule' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      issues: write
      contents: read
    steps:
      - name: Checkout failure reporter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Create or update failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERSION: ${{ needs.build.outputs.expected_evr }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        with:
          script: |
            const report = require('./.github/scripts/report-daily-stable-failure.js');
            await report({github, context, core}, {
              title: '[fedora44-daily-stable] package archive failure',
              distro: 'Fedora 44',
              labels: ['release', 'packaging', 'daily-stable', 'automated'],
              version: process.env.VERSION,
              results: {
                preflight: process.env.PREFLIGHT_RESULT,
                build: process.env.BUILD_RESULT,
                publish: process.env.PUBLISH_RESULT,
                verify: process.env.VERIFY_RESULT
              }
            });
